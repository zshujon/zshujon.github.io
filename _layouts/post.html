<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>

<body>
  <main class="course-main-wrapper">
    <div class="main-content course-main-content">
      <div class="course-nav">
        <a href="/" class="course-nav-link" onclick="sessionStorage.setItem('activePage', 'blog');">← Back to Blog</a>
      </div>

      <article class="blog-post-detail">
        <header class="post-header">
          <h1 class="h1 post-title">{{ page.title }}</h1>
          <div class="post-meta">
            <span class="post-category">{{ page.category }}</span>
            <span class="dot"></span>
            <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%b %d, %Y" }}</time>
          </div>
        </header>

        <div class="post-content">
          {{ content }}
        </div>
      </article>
    </div>
  </main>

  {% include footer-scripts.html %}
</body>
</html>
